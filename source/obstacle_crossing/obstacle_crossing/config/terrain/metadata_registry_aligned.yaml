# Registry-aligned motion-matched metadata for the current six-terrain training pool.
#
# This file is the generated/curated training-side metadata that matches the
# terrain ids and terrain ordering defined in:
#   source/obstacle_crossing/obstacle_crossing/terrain/terrain_registry.py
#
# It should be treated as the training-time metadata view derived from the
# registry, rather than as an independent source of truth.
#
# terrain_file and motion_file paths are resolved relative to the cfg.path value
# passed to MotionMatchedTerrainCfg / TerrainMotionCfg, currently the repo root.

terrains:
  - terrain_id: 0
    terrain_file: terrains/centered/1.Continuous Ramp.stl
  - terrain_id: 1
    terrain_file: terrains/centered/2.Continuous Hurdling.stl
  - terrain_id: 2
    terrain_file: terrains/centered/3.Cross Slope.stl
  - terrain_id: 3
    terrain_file: terrains/centered/4.Consecutive Slalom.stl
  - terrain_id: 4
    terrain_file: terrains/centered/5.Symmetrical Ramp.stl
  - terrain_id: 6
    terrain_file: terrains/centered/7.S-Curve.stl

motion_files:
  - terrain_id: 0
    motion_file: assets/action_file/ramp_retargetted.npz
    weight: 1.0
  - terrain_id: 1
    motion_file: assets/action_file/hurdling_retargetted.npz
    weight: 1.0
  - terrain_id: 2
    motion_file: assets/action_file/cross_slope_retargetted.npz
    weight: 1.0
  - terrain_id: 3
    motion_file: assets/action_file/slalom_retargetted.npz
    weight: 1.0
  - terrain_id: 4
    motion_file: assets/action_file/symmetrical_ramp_retargetted.npz
    weight: 1.0
  - terrain_id: 6
    motion_file: assets/action_file/s_curve_retargetted.npz
    weight: 1.0
